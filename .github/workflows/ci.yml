name: Verify application and database
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: touchline
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: touchline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U touchline -d touchline_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://touchline:ci-only-password@127.0.0.1:5432/touchline_test
      REDIS_URL: redis://127.0.0.1:6379
      ALLOW_DEVELOPMENT_SEED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:migrate
      - run: npm run db:status
      - run: npm run db:seed
      - run: npm run db:verify
      - run: npm run matches:verify
      - run: npm run competitions:verify
      - run: npm run infra:check
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
